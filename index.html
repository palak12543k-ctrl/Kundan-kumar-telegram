    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playboymeeting - Join Telegram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #030712;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Animated Star Field Canvas Background */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Glowing Neon Borders & Shadows */
        .neon-avatar {
            box-shadow: 0 0 20px #06b6d4, 0 0 40px #a855f7, inset 0 0 15px #06b6d4;
            border: 3px solid #06b6d4;
        }

        .neon-card {
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(6, 182, 212, 0.5);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3), inset 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .neon-badge {
            background: rgba(15, 10, 25, 0.9);
            border: 2px solid #ec4899;
            box-shadow: 0 0 15px #ec4899, inset 0 0 10px #ec4899;
        }

        .neon-button {
            background: linear-gradient(90deg, #ec4899 0%, #a855f7 50%, #06b6d4 100%);
            background-size: 200% auto;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.8), 0 0 40px rgba(6, 182, 212, 0.6);
            transition: all 0.4s ease;
        }

        .neon-button:hover {
            background-position: right center;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 35px rgba(236, 72, 153, 1), 0 0 50px rgba(6, 182, 212, 0.8);
        }

        .neon-timer-circle {
            border: 3.5px solid #06b6d4;
            box-shadow: 0 0 20px #06b6d4, inset 0 0 20px rgba(6, 182, 212, 0.5);
            background: rgba(5, 10, 20, 0.9);
        }

        .neon-footer-box {
            background: rgba(15, 10, 25, 0.9);
            border: 2px solid #a855f7;
            box-shadow: 0 0 15px #a855f7, inset 0 0 8px #a855f7;
        }

        /* Pulse Animations */
        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.03);
                filter: brightness(1.2);
            }
        }

        .pulse-anim {
            animation: pulseGlow 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-y-auto">

    <canvas id="starfield"></canvas>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-sm flex flex-col items-center py-6">

        <!-- Top Avatar Circle with Glowing Ring -->
        <div class="relative mb-6">
            <div class="w-28 h-28 rounded-full neon-avatar flex items-center justify-center overflow-hidden bg-black/60 relative">
                <!-- User Profile SVG Placeholder / Avatar -->
                <svg class="w-16 h-16 text-cyan-400 opacity-90" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
        </div>

        <!-- Neon Content Card -->
        <div class="w-full neon-card rounded-3xl p-6 flex flex-col items-center space-y-6 text-center">

            <!-- Title -->
            <h1 class="text-3xl font-extrabold tracking-wide text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]">
                playboymeeting
            </h1>

            <!-- Real Service Badge -->
            <div class="neon-badge px-6 py-1.5 rounded-full text-sm font-semibold text-yellow-300 tracking-wider inline-flex items-center gap-1">
                Real service 🔥
            </div>

            <!-- Join Telegram Button -->
            <a id="telegramBtn" href="https://t.me/+FTW74SuhXVIzMTZl" target="_blank" rel="noopener noreferrer" class="w-full">
                <button class="w-full neon-button py-4 rounded-full text-white font-bold text-lg tracking-wider uppercase pulse-anim">
                    JOIN TELEGRAM
                </button>
            </a>

            <!-- Countdown Circular Meter -->
            <div class="relative my-2">
                <div class="w-28 h-28 rounded-full neon-timer-circle flex items-center justify-center">
                    <span id="timerSeconds" class="text-2xl font-black text-white tracking-widest drop-shadow-[0_0_8px_#06b6d4]">
                        .60
                    </span>
                </div>
            </div>

            <!-- Auto Joining Status Box -->
            <div class="w-full neon-footer-box py-3 px-4 rounded-2xl text-yellow-300 font-semibold text-sm tracking-wide">
                Auto joining in <span id="autoCountText">60</span> seconds...
            </div>

        </div>

        <!-- Footer Caption -->
        <p class="mt-4 text-xs text-cyan-300/70 tracking-wider uppercase">
            Official Channel Verification
        </p>

    </main>

    <script>
        // Target Telegram Link
        const TARGET_LINK = "https://t.me/+FTW74SuhXVIzMTZl";
        let countdown = 60;

        const timerSecondsEl = document.getElementById('timerSeconds');
        const autoCountTextEl = document.getElementById('autoCountText');

        // Countdown Timer Logic
        const interval = setInterval(() => {
            countdown--;
            
            // Format single digits with leading dot to mimic screenshot format
            const formattedVal = countdown < 10 ? `.0${countdown}` : `.${countdown}`;
            timerSecondsEl.textContent = formattedVal;
            autoCountTextEl.textContent = countdown;

            if (countdown <= 0) {
                clearInterval(interval);
                timerSecondsEl.textContent = ".00";
                autoCountTextEl.textContent = "0";
                // Auto redirect when timer reaches zero
                window.location.href = TARGET_LINK;
            }
        }, 1000);

        // Canvas Particle Starfield Background Animation
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.02 + 0.005;
                this.dir = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.alpha += this.speed * this.dir;
                if (this.alpha >= 1 || this.alpha <= 0.1) {
                    this.dir *= -1;
                }
                this.y -= 0.2;
                if (this.y < 0) this.y = height;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let stars = [];
        function initStars() {
            stars = [];
            const count = Math.floor((width * height) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push(new Star());
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animateStars);
        }

        initStars();
        animateStars();
    </script>
</body>
